# Repo root must be Railway "Root Directory" (empty) so `bun.lock` and workspaces resolve.
# Builds: Railpack reads ./railpack.json (bun install + turbo --filter=server).
#
# Or use Dockerfile: Builder → Dockerfile → path `apps/server/Dockerfile` (context = repo root).

[deploy]
startCommand = "bun apps/server/dist/index.mjs"
